<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Bypass Link | ditxzproduct</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;color:#172033}
.container{width:100%;max-width:420px;text-align:center}
.logo{font-size:30px;font-weight:800;letter-spacing:-1px;margin-bottom:9px}
.logo span{color:#2878ef}
.subtitle{color:#8993a3;font-size:13px;margin-bottom:35px}
.input-box{width:100%;height:53px;border:1px solid #e2e7ef;border-radius:12px;padding:0 16px;font-size:14px;outline:none;transition:.25s}
.input-box:focus{border-color:#2878ef;box-shadow:0 0 0 3px #2878ef18}
button{width:100%;height:52px;margin-top:14px;border:0;border-radius:12px;background:#2878ef;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s;box-shadow:0 5px 14px #2878ef30}
button:hover{background:#1766dc}
button:active{transform:scale(.96);box-shadow:0 2px 6px #2878ef30}
button:disabled{opacity:.65;cursor:wait}
.result{display:none;margin-top:25px;padding:18px;border:1px solid #e7ebf2;border-radius:13px;text-align:left;animation:appear .35s ease}
.result.show{display:block}
.result h3{font-size:14px;margin-bottom:10px}
.destination{color:#2878ef;font-size:13px;word-break:break-all;line-height:1.6}
.message{font-size:12px;color:#929baa;margin-top:13px;line-height:1.5}
.error{color:#c24141}
.watermark{position:fixed;bottom:18px;right:20px;color:rgba(30,45,70,.22);font-size:12px;font-weight:700;letter-spacing:1px;pointer-events:none}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<main class="container">
  <div class="logo">Bypass<span>Link</span></div>
  <p class="subtitle">Simple Link Destination Utility</p>
  <input type="url" id="linkInput" class="input-box" placeholder="Masukkan link shortener..." autocomplete="url">
  <button id="checkBtn" type="button">SKIP KE TUJUAN →</button>

  <section class="result" id="result" aria-live="polite">
    <h3>LINK TUJUAN</h3>
    <p class="destination" id="destination"></p>
    <button id="continueBtn" type="button">LANJUTKAN →</button>
    <p class="message" id="message">Periksa alamat tujuan sebelum melanjutkan.</p>
  </section>
</main>
<div class="watermark">ditxzproduct</div>

<script>
const input = document.getElementById("linkInput");
const checkBtn = document.getElementById("checkBtn");
const result = document.getElementById("result");
const destination = document.getElementById("destination");
const message = document.getElementById("message");
const continueBtn = document.getElementById("continueBtn");
let targetUrl = "";

checkBtn.addEventListener("click", async () => {
  result.classList.remove("show");
  targetUrl = "";

  let parsed;
  try {
    parsed = new URL(input.value.trim());
    if (!["http:", "https:"].includes(parsed.protocol)) throw new Error();
  } catch {
    message.textContent = "Masukkan URL HTTP/HTTPS yang valid.";
    message.className = "message error";
    result.classList.add("show");
    destination.textContent = "URL tidak valid";
    return;
  }

  checkBtn.disabled = true;
  checkBtn.textContent = "MEMERIKSA LINK...";
  try {
    const response = await fetch("/api/resolve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: parsed.href })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Gagal memeriksa link.");

    const finalUrl = new URL(data.destination);
    if (!["http:", "https:"].includes(finalUrl.protocol)) {
      throw new Error("Protokol tujuan tidak didukung.");
    }

    targetUrl = finalUrl.href;
    destination.textContent = targetUrl;
    message.textContent = "Periksa alamat tujuan sebelum melanjutkan.";
    message.className = "message";
    result.classList.add("show");
  } catch (error) {
    destination.textContent = "Tujuan belum ditemukan";
    message.textContent = error.message;
    message.className = "message error";
    result.classList.add("show");
  } finally {
    checkBtn.disabled = false;
    checkBtn.textContent = "SKIP KE TUJUAN →";
  }
});

continueBtn.addEventListener("click", () => {
  if (!targetUrl) return;
  window.open(targetUrl, "_blank", "noopener,noreferrer");
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter") checkBtn.click();
});
</script>
</body>
</html>
